# A 3-replica Deployment with resource requests/limits and a rolling-update strategy.
#   kubectl apply -f 01-deployment.yaml
#   kubectl rollout status deploy/web
#   kubectl set image deploy/web nginx=nginx:1.27 && kubectl rollout history deploy/web
#   kubectl rollout undo deploy/web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.26
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
