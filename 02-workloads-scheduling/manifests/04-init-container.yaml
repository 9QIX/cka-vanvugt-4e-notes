# Init containers run to completion, in order, before the app container starts.
#   kubectl apply -f 04-init-container.yaml
#   kubectl get pod init-demo -w            # Init:0/1 -> PodInitializing -> Running
#   kubectl exec init-demo -- cat /usr/share/nginx/html/index.html
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
spec:
  initContainers:
  - name: make-page
    image: busybox:1.36
    command: ["sh", "-c", "echo 'written by the init container' > /work/index.html"]
    volumeMounts:
    - name: work
      mountPath: /work
  containers:
  - name: nginx
    image: nginx:1.26
    volumeMounts:
    - name: work
      mountPath: /usr/share/nginx/html
  volumes:
  - name: work
    emptyDir: {}
