# Native sidecar: an init container with restartPolicy: Always starts before the app,
# keeps running next to it, and is shut down after it.
#   kubectl apply -f 05-sidecar-native.yaml
#   kubectl logs sidecar-demo -c log-shipper -f     # the app's log lines, read by the sidecar
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  initContainers:
  - name: log-shipper
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "touch /var/log/app/app.log; tail -F /var/log/app/app.log"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      i=0
      while true; do
        echo "$(date -Iseconds) request $i" >> /var/log/app/app.log
        i=$((i+1))
        sleep 2
      done
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  volumes:
  - name: logs
    emptyDir: {}
