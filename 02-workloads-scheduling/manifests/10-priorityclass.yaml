# PriorityClass: higher value wins scheduling and can preempt lower-priority pods.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 100000
globalDefault: false
description: "Critical workloads; may preempt lower-priority pods."
---
apiVersion: v1
kind: Pod
metadata:
  name: important
spec:
  priorityClassName: high-priority
  containers:
  - name: nginx
    image: nginx:1.26
