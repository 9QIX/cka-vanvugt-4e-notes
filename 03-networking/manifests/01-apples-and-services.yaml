# Lab app for services, Ingress and Gateway API: Deployment "apples" (3 x nginx) plus two Services.
#   kubectl apply -f 01-apples-and-services.yaml
#   kubectl get svc,endpoints apples apples-nodeport
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apples
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apples
  template:
    metadata:
      labels:
        app: apples
    spec:
      containers:
      - name: nginx
        image: nginx:1.26
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apples
spec:
  type: ClusterIP
  selector:
    app: apples
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apples-nodeport
spec:
  type: NodePort
  selector:
    app: apples
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30085
