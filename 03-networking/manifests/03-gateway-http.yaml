# Gateway API: a Gateway (the listener) and an HTTPRoute (the routing rule) for "apples".
# Needs lab-setup/scripts/install-gateway-controller.sh (GatewayClass "nginx").
#   kubectl get gatewayclass
#   kubectl get gateway,httproute
#   kubectl describe gateway fruit-gw        # Programmed: True when ready
#
# Test with port-forward (works regardless of how the data-plane Service is exposed):
#   kubectl port-forward svc/fruit-gw-nginx 8080:80 &
#   curl -H 'Host: my.fruit' http://127.0.0.1:8080/
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fruit-gw
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: my.fruit
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apples
spec:
  parentRefs:
  - name: fruit-gw
  hostnames:
  - my.fruit
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: apples
      port: 80
