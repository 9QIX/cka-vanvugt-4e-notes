# NetworkPolicy lab: only "sleepybox1" from the default namespace may reach the web server in "restricted".
# Requires a CNI that enforces NetworkPolicy (Calico does; the kubenet-style defaults do not).
#
#   kubectl apply -f 05-networkpolicy-lab.yaml
#   kubectl exec sleepybox1 -- wget -qO- --timeout=3 http://lab-server.restricted   # works
#   kubectl exec sleepybox2 -- wget -qO- --timeout=3 http://lab-server.restricted   # times out
apiVersion: v1
kind: Namespace
metadata:
  name: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-server
  namespace: restricted
  labels:
    app: lab-server
spec:
  containers:
  - name: nginx
    image: nginx:1.26
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-server
  namespace: restricted
spec:
  selector:
    app: lab-server
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: sleepybox1
  labels:
    app: sleepybox1
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: sleepybox2
  labels:
    app: sleepybox2
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sleepybox1-only
  namespace: restricted
spec:
  podSelector: {}               # applies to every pod in "restricted"
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:        # AND (same list item): namespace AND pod must both match
        matchLabels:
          kubernetes.io/metadata.name: default
      podSelector:
        matchLabels:
          app: sleepybox1
