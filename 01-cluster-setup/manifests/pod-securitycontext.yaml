# Pod-level and container-level securityContext.
# Verify:  kubectl exec sec-demo -- id      -> uid=1000 gid=3000 groups=2000,3000
#          kubectl exec sec-demo -- touch /data/ok   (works, fsGroup owns the volume)
#          kubectl exec sec-demo -- touch /ro-test   (fails: read-only root filesystem)
apiVersion: v1
kind: Pod
metadata:
  name: sec-demo
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  volumes:
  - name: data
    emptyDir: {}
