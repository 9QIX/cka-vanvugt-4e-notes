# ConfigMap and Secret consumed as files AND as environment variables.
#   kubectl apply -f 03-configmap-secret-volumes.yaml
#   kubectl exec cfg-demo -- ls /etc/app /etc/creds
#   kubectl exec cfg-demo -- cat /etc/app/greeting.txt
#   kubectl exec cfg-demo -- cat /etc/creds/password     # decoded for you
#   kubectl exec cfg-demo -- env | grep -E 'GREETING|DB_USER'
# Imperative equivalents:
#   kubectl create configmap app-config --from-literal=greeting.txt='hello from a ConfigMap'
#   kubectl create secret generic app-secret --from-literal=password=s3cr3t --from-literal=username=demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  greeting.txt: "hello from a ConfigMap"
  LOG_LEVEL: "debug"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:                      # stringData is plain text in YAML, stored base64-encoded
  username: demo
  password: not-a-real-password
---
apiVersion: v1
kind: Pod
metadata:
  name: cfg-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    env:
    - name: GREETING
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: greeting.txt
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: username
    volumeMounts:
    - name: config
      mountPath: /etc/app
    - name: creds
      mountPath: /etc/creds
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: app-config
  - name: creds
    secret:
      secretName: app-secret
