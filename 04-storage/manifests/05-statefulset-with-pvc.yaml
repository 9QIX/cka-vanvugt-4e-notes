# StatefulSet with per-pod storage via volumeClaimTemplates (needs StorageClass "nfs-client").
#   kubectl apply -f 05-statefulset-with-pvc.yaml
#   kubectl get pods,pvc -l app=db
#   kubectl exec db-0 -- sh -c 'echo db-0 data > /data/state'
#   kubectl delete pod db-0 && kubectl wait --for=condition=Ready pod/db-0 --timeout=90s
#   kubectl exec db-0 -- cat /data/state          # still there: the claim outlives the pod
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: nfs-client
      resources:
        requests:
          storage: 100Mi
