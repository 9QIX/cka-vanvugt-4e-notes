# The common in-pod volume types. Two containers share an emptyDir; a hostPath is mounted read-only.
#   kubectl apply -f 02-pod-volumes.yaml
#   kubectl exec volumes-demo -c writer -- sh -c 'echo shared > /shared/note'
#   kubectl exec volumes-demo -c reader -- cat /shared/note
apiVersion: v1
kind: Pod
metadata:
  name: volumes-demo
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  - name: reader
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: shared
      mountPath: /shared
    - name: node-logs
      mountPath: /node-logs
      readOnly: true
  volumes:
  - name: shared
    emptyDir: {}                 # lives and dies with the pod
  - name: node-logs
    hostPath:
      path: /var/log             # a directory on the node (avoid hostPath in real workloads)
      type: Directory
